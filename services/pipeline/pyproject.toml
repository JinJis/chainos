[project]
name = "chainos-pipeline"
version = "0.1.0"
description = "Chainos pipeline — news/disclosure ingestion + Predict momentum jobs."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "redis>=5.0.8",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.32",
    "psycopg[binary]>=3.2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.6.0", "mypy>=1.11.0"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
